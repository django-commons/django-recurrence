[project]
name = "django-recurrence"
version = "1.14"
description = "Django utility wrapping dateutil.rrule"
authors = [
    {name = "Tamas Kemenczy", email = "tamas.kemenczy@gmail.com"},
    {name = "Lino Helms", email = "lino@lino.io"}
]
dependencies = [
    "django>=5.2",
    "python-dateutil",
]
requires-python = ">=3.11"
readme = "README.rst"
license = {text = "BSD"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # TODO: Python 3.14 support requires updates for the module
    # "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Homepage = "https://github.com/jazzband/django-recurrence"
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.package-dir]
recurrence = "recurrence"
